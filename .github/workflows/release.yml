name: Release signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Functions dependencies
        run: pnpm --dir functions install --frozen-lockfile

      - name: Run connected instrumentation regression on tagged source
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          script: pnpm test:android-connected:unix

      - name: Capture device logs on failure
        if: failure()
        shell: bash
        run: |
          serial="$(adb devices | awk '$1 ~ /^emulator-/ && $2 == "device" { print $1; exit }')"
          if [ -n "$serial" ]; then
            adb -s "$serial" logcat -d > logcat.txt || true
            adb -s "$serial" shell getprop > emulator-properties.txt || true
          fi

      - name: Upload device reports and logcat on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-connected-android-test-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            emulator.log
            logcat.txt
            emulator-properties.txt
          if-no-files-found: ignore

      - name: Validate version and tag
        id: metadata
        run: >-
          node scripts/release-metadata.mjs
          --tag "$RELEASE_TAG"
          --github-output "$GITHUB_OUTPUT"

      - name: Validate copy and documentation
        run: node --test scripts/copy-integrity.test.mjs scripts/docs-integrity.test.mjs

      - name: Restore private inputs, test, and build signed release
        env:
          DAILY_RECORD_KEYSTORE_FILE: ${{ runner.temp }}/daily-record-release.jks
          DAILY_RECORD_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DAILY_RECORD_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DAILY_RECORD_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          trap 'rm -f "$DAILY_RECORD_KEYSTORE_FILE" app/google-services.json' EXIT
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64 repository secret}"
          : "${DAILY_RECORD_KEYSTORE_PASSWORD:?Missing RELEASE_KEYSTORE_PASSWORD repository secret}"
          : "${DAILY_RECORD_KEY_ALIAS:?Missing RELEASE_KEY_ALIAS repository secret}"
          : "${DAILY_RECORD_KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD repository secret}"
          : "${GOOGLE_SERVICES_JSON_BASE64:?Missing GOOGLE_SERVICES_JSON_BASE64 repository secret}"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$DAILY_RECORD_KEYSTORE_FILE"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          ./gradlew \
            testDebugUnitTest \
            lintDebug \
            assembleRelease \
            --no-configuration-cache \
            --stacktrace

      - name: Verify signature and prepare checksum
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk "release-output/$APK_NAME"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "release-output/$APK_NAME"
          EXPECTED_FINGERPRINT="afa5241bf13c9daa6f45ae7c8d699d7540d011f0e219e54e5b97bf2c996b3e61"
          ACTUAL_FINGERPRINT="$("$APKSIGNER" verify --print-certs "release-output/$APK_NAME" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_FINGERPRINT" ] || [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::APK certificate fingerprint does not match the stable release key. Stop and rotate the signing secrets before publishing."
            exit 1
          fi
          echo "Verified release certificate fingerprint: $ACTUAL_FINGERPRINT"
          (
            cd release-output
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.apk_name }}
          path: release-output/*
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
          NOTES_PATH: ${{ steps.metadata.outputs.notes_path }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-output/$APK_NAME" \
            "release-output/$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file "$NOTES_PATH" \
            --prerelease \
            --verify-tag

